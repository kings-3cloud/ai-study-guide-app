<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Assistant</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>Study Assistant</h1>
      <nav>
        <a href="progress.html">My Progress</a>
      </nav>
    </div>
  </header>

  <main class="chat-layout">
    <div id="chat-box" class="chat-box" role="log" aria-live="polite" aria-label="Conversation"></div>

    <div class="input-area">
      <div class="input-row">
        <input
          type="text"
          id="message-input"
          placeholder="Ask me anything, paste a URL, or describe a topic…"
          autocomplete="off"
          aria-label="Message input"
        />
        <button id="send-btn" aria-label="Send message">Send</button>
      </div>
      <div class="action-row">
        <button id="new-chat-btn" class="btn-secondary" aria-label="Start a new chat">New Chat</button>
        <button id="upload-btn" class="btn-secondary" aria-label="Upload a PDF to study">Upload PDF</button>
        <input type="file" id="pdf-input" accept=".pdf" hidden aria-hidden="true" />
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
